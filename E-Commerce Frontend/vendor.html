<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vendor Panel - ecocart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">ecocart</a>

        <div class="ms-auto">
            <span id="vendor-name"></span>
            <button class="btn btn-outline-danger btn-sm ms-3" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<!-- Main -->
<div class="container mt-4">

    <h2>Vendor Dashboard</h2>

    <!-- Add Product Button -->
    <div class="d-flex justify-content-between mb-3">
        <h4>Your Products</h4>
        <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#addProductModal">
            Add Product
        </button>
    </div>

    <!-- Products -->
    <div class="row" id="products-container"></div>

</div>

<!-- Add Product Modal -->
<div class="modal fade" id="addProductModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5>Add Product</h5>
            </div>

            <div class="modal-body">
                <form id="add-product-form">

                    <input class="form-control mb-2" id="productName" placeholder="Name" required>
                    <input class="form-control mb-2" id="productPrice" type="number" placeholder="Price" required>
                    <input class="form-control mb-2" id="productStock" type="number" placeholder="Stock" required>
                    <input class="form-control mb-2" id="productImage" placeholder="Image URL" required>

                    <textarea class="form-control mb-2" id="productDescription" placeholder="Description"></textarea>

                    <select class="form-control mb-2" id="productCategory">
                        <option value="1">Electronics</option>
                        <option value="2">Fashion</option>
                        <option value="3">Home</option>
                    </select>

                    <button class="btn btn-success w-100">Add</button>

                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/vendor.js"></script>

</body>
</html>
